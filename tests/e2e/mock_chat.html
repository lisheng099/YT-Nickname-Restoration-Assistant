<!DOCTYPE html>
<html dark>
  <head>
    <meta charset="utf-8" />
    <title>mock live chat</title>
    <style>
      body { background: #0f0f0f; color: #fff; font: 13px Roboto, Arial, sans-serif; margin: 0; padding: 8px; width: 380px; }
      yt-live-chat-text-message-renderer, yt-live-chat-paid-message-renderer { display: block; padding: 4px 8px; }
      #author-photo { display: inline-block; width: 24px; height: 24px; border-radius: 50%; background: #666; vertical-align: middle; margin-right: 8px; }
      #author-name { color: #aaa; font-weight: 500; margin-right: 8px; }
      #author-name.owner { background: #ffd600; color: #111; padding: 0 4px; border-radius: 2px; }
    </style>
  </head>
  <body>
    <div id="items"></div>
    <script>
      // 模擬 YouTube 聊天室：訊息元素帶有 .data (頻道 ID 只存在於頁面環境)
      // noPhoto 為 true 時不放頭像 (測試找不到頭像時的退路)
      window.addChat = function (id, handle, channelId, message, tag, noPhoto) {
        const el = document.createElement(tag || "yt-live-chat-text-message-renderer");
        el.id = id;
        el.data = { authorExternalChannelId: channelId, timestampUsec: String(Date.now() * 1000) };
        if (!noPhoto) {
          const photo = document.createElement("yt-img-shadow");
          photo.id = "author-photo";
          // 模擬 YouTube 頭像原本的點擊行為，驗證擴充功能會攔下來
          photo.addEventListener("click", () => (window.nativeAvatarClicks = (window.nativeAvatarClicks || 0) + 1));
          el.appendChild(photo);
        }
        const chip = document.createElement("yt-live-chat-author-chip");
        const name = document.createElement("span");
        name.id = "author-name";
        name.textContent = handle;
        chip.appendChild(name);
        const msg = document.createElement("span");
        msg.id = "message";
        msg.textContent = message;
        el.append(chip, msg);
        document.getElementById("items").appendChild(el);
        return el;
      };
      // 模擬 YouTube 重複使用同一個元素給另一位觀眾
      window.reuseChat = function (id, newId, handle, channelId, message) {
        const el = document.getElementById(id);
        el.data = { authorExternalChannelId: channelId };
        el.id = newId;
        el.querySelector("#author-name").textContent = handle;
        el.querySelector("#message").textContent = message;
      };
    </script>
  </body>
</html>
