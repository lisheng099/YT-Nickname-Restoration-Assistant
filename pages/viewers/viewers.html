<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="vnm_title">觀眾筆記管理</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f5;
        --card: #fff;
        --text: #222;
        --muted: #666;
        --line: #e3e3e3;
        --accent: #1565c0;
        --danger: #c62828;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #181818;
          --card: #242424;
          --text: #eee;
          --muted: #aaa;
          --line: #3a3a3a;
          --accent: #64b5f6;
          --danger: #ef9a9a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0 auto;
        padding: 20px 16px 60px;
        max-width: 960px;
        font: 14px/1.5 "Segoe UI", "Microsoft JhengHei", sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      h1 { margin: 0; font-size: 20px; }
      h2 { margin: 0 0 10px; font-size: 15px; }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 14px;
      }
      .head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
      .muted { color: var(--muted); font-size: 13px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      button, .btn {
        font: inherit; color: inherit; cursor: pointer;
        padding: 5px 12px; border-radius: 6px;
        border: 1px solid var(--line); background: transparent;
      }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      @media (prefers-color-scheme: dark) { button.primary { color: #111; } }
      button.danger { color: var(--danger); }
      input[type="text"], input[type="number"], input[type="search"], select, textarea {
        font: inherit; color: inherit; background: transparent;
        border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
      }
      input[type="search"] { flex: 1; min-width: 180px; }
      textarea { width: 100%; min-height: 90px; resize: vertical; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
      td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
      .id { font: 12px monospace; color: var(--muted); word-break: break-all; }
      .chip {
        display: inline-block; padding: 0 7px; margin: 0 3px 3px 0; border-radius: 9px;
        font-size: 12px; line-height: 18px; background: rgba(128, 128, 128, 0.25);
      }
      .chip.ext { border: 1px dashed var(--muted); }
      [hidden] { display: none !important; }
      .empty { padding: 30px 0; text-align: center; color: var(--muted); }
      .tagdef { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
      .tagdef input[type="text"] { flex: 1; min-width: 0; }
      input[type="color"] { width: 32px; height: 28px; padding: 0; border: none; background: none; }
      dialog {
        width: min(460px, calc(100vw - 24px)); border: 1px solid var(--line); border-radius: 10px;
        background: var(--card); color: var(--text); padding: 16px;
      }
      dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
      dialog label { display: block; margin: 10px 0 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
      dialog input[type="text"], dialog input[type="number"] { width: 100%; }
      .checks label { display: inline-flex; align-items: center; gap: 4px; margin: 0 10px 4px 0; font-size: 13px; color: inherit; font-weight: 400; }
      #status { min-height: 20px; }
    </style>
  </head>
  <body>
    <div class="card head">
      <div>
        <h1 data-i18n="vnm_title">觀眾筆記管理</h1>
        <div class="muted" data-i18n="vnm_subtitle">標籤、備註、評分與自訂暱稱都儲存在這台電腦的瀏覽器中。</div>
      </div>
      <div class="row">
        <label class="row" style="gap: 4px"><input type="checkbox" id="enabled" /><span data-i18n="vnm_enabled">在聊天室顯示</span></label>
        <button id="openCache" data-i18n="vnm_open_cache">暱稱快取管理</button>
        <button id="openOptions" hidden data-i18n="vnm_open_options">更多設定</button>
      </div>
    </div>

    <div class="card">
      <div class="row" style="margin-bottom: 10px">
        <input type="search" id="search" data-i18n-placeholder="vnm_search_ph" placeholder="搜尋暱稱、@ID、標籤或備註" />
        <select id="sort" aria-label="sort">
          <option value="updated" data-i18n="vnm_sort_updated">最近更新</option>
          <option value="score" data-i18n="vnm_sort_reactions">表情次數高到低</option>
          <option value="name" data-i18n="vnm_sort_name">名稱</option>
        </select>
        <button id="addViewer" class="primary" data-i18n="vnm_add_viewer">新增觀眾</button>
      </div>
      <div class="muted" id="stats"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="vnm_col_viewer">觀眾</th>
              <th data-i18n="vnm_col_tags">標籤</th>
              <th data-i18n="vnm_col_reactions">表情統計</th>
              <th data-i18n="vnm_col_notes">備註</th>
              <th data-i18n="vnm_col_action">操作</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" hidden></div>
      <div class="row" id="pager" hidden style="justify-content: center; margin-top: 10px">
        <button id="prev" data-i18n="prev_page">上一頁</button>
        <span id="pageInfo" class="muted"></span>
        <button id="next" data-i18n="next_page">下一頁</button>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="vnm_tags_title">標籤</h2>
      <div id="tagDefs"></div>
      <div class="tagdef">
        <input type="text" id="newTagLabel" maxlength="30" data-i18n-placeholder="vn_new_tag" placeholder="新標籤名稱" />
        <input type="color" id="newTagColor" value="#90caf9" />
        <button id="addTag" data-i18n="vn_add">新增</button>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="vnm_backup_title">備份與還原</h2>
      <div class="row">
        <button id="exportBtn" data-i18n="vnm_export">匯出 JSON</button>
        <button id="importMerge" data-i18n="vnm_import_merge">匯入並合併</button>
        <button id="importReplace" data-i18n="vnm_import_replace">匯入並取代</button>
        <button id="clearBtn" class="danger" data-i18n="vnm_clear">清除所有觀眾筆記</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden />
      </div>
      <div class="muted" id="status" role="status" style="margin-top: 8px"></div>
    </div>

    <dialog id="editor">
      <form method="dialog" id="editorForm">
        <h2 id="editorTitle"></h2>
        <div id="identityFields">
          <label for="edHandle" data-i18n="vnm_field_identity">@ID 或頻道 ID (UC…)</label>
          <input type="text" id="edHandle" maxlength="80" />
        </div>
        <label for="edNick" data-i18n="vn_nickname">自訂暱稱</label>
        <input type="text" id="edNick" maxlength="50" />
        <label data-i18n="vn_reactions">表情統計</label>
        <div class="row" id="edReactions" style="margin-bottom: 6px"></div>
        <div class="row" style="margin-bottom: 4px">
          <input type="text" id="edReactionAdd" maxlength="16" style="flex: 1; min-width: 0" data-i18n-placeholder="vn_reaction_add_ph" placeholder="自訂表情（如 ❤️）" />
          <button type="button" id="edReactionAddBtn">+1</button>
          <button type="button" id="edReactionReset" data-i18n="vn_score_reset">歸零</button>
        </div>
        <div class="muted" style="font-size: 11px" data-i18n="vn_reactions_hint">左鍵 +1，右鍵 -1</div>
        <label data-i18n="vn_tags">標籤</label>
        <div class="checks" id="edTags"></div>
        <label for="edNotes" data-i18n="vnm_field_notes">備註 (每行一則)</label>
        <textarea id="edNotes"></textarea>
        <div class="muted" id="edError" role="alert"></div>
        <div class="row" style="justify-content: flex-end; margin-top: 12px">
          <button type="button" id="edCancel" data-i18n="vnm_cancel">取消</button>
          <button type="submit" class="primary" data-i18n="vnm_save">儲存</button>
        </div>
      </form>
    </dialog>

    <script src="../../js/shared/config.js"></script>
    <script src="../../js/shared/utils.js"></script>
    <script src="../../js/shared/locales.js"></script>
    <script src="../../js/shared/i18n.js"></script>
    <script src="../../js/shared/viewer_model.js"></script>
    <script src="viewers.js"></script>
  </body>
</html>
