name: test

# Kept small because GitHub Actions minutes are limited: Markdown / docs-only changes start no run,
# a newer commit cancels the older run of the same PR, and the push to main after a merge is not
# re-tested (the PR already was). Actions tab -> test -> Run workflow runs it by hand.
on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "LICENSE", ".gitignore"]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
